[package]
name = "torsh-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Backend abstraction layer for ToRSh"
readme = "README.md"
documentation = "https://docs.rs/torsh-backend"
rust-version.workspace = true
keywords = ["deep-learning", "gpu", "cuda", "metal", "backend"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[dependencies]
# Core dependencies
torsh-core = { workspace = true }
# SciRS2-Core beta.4 with performance features: parallel operations and SIMD
scirs2-core = { workspace = true, features = ["parallel", "simd"] }

# Utilities
num-traits = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }

# FFT engine (Pure Rust, OxiRS ecosystem) for CPU spectral operations
oxifft = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async and concurrency
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, optional = true, features = ["time"] }

# Logging and tracing
tracing = { workspace = true, optional = true }

# Serialization
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Cryptography and ID generation
uuid = { workspace = true }
sha2 = { workspace = true }

# CPU backend dependencies
# ⚠️ SciRS2 POLICY: rayon is LEGACY - use scirs2-core::parallel_ops for new code
rayon = { workspace = true, optional = true }  # DEPRECATED: Use scirs2-core::parallel_ops
num_cpus = { workspace = true, optional = true }
# libc = { workspace = true, optional = true }  # REMOVED: Pure Rust (SciRS2 ecosystem)
# ✅ Pure Rust: sysinfo replaces libc for system information
sysinfo = { workspace = true, optional = true }
raw-cpuid = { workspace = true, optional = true }
# ⚠️ SciRS2 POLICY: wide is LEGACY - use scirs2-core::simd_ops for new code
wide = { workspace = true, optional = true }  # DEPRECATED: Use scirs2-core::simd_ops
spin = { workspace = true, optional = true }

# CUDA backend dependencies (feature-gated)
half = { workspace = true, optional = true }

# WebGPU backend dependencies (cross-platform)
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
log = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }

# Metal backend dependencies (Apple platforms only)
[target.'cfg(target_os = "macos")'.dependencies]
metal = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-metal-performance-shaders = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
approx = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

# Temporarily disabled due to API changes requiring updates
# [[bench]]
# name = "backend_benchmarks"
# harness = false

# [[bench]]
# name = "cpu_benchmarks"
# harness = false

[[bench]]
name = "chunking_validation"
harness = false
required-features = ["cpu"]

[features]
default = ["std", "cpu", "async"]
std = ["torsh-core/std"]
serialize = ["dep:serde", "dep:serde_json", "torsh-core/serialize"]
tracing = ["dep:tracing"]

# Optional logging facade (used by the Metal and WebGPU backends).
log = ["dep:log"]

# Backend features
# ✅ Pure Rust: libc removed, sysinfo added (SciRS2 Pure Rust ecosystem)
cpu = ["dep:rayon", "dep:num_cpus", "dep:sysinfo", "dep:raw-cpuid", "dep:spin", "dep:bytemuck"]
# CUDA: torsh-backend no longer carries its own CUDA stack. The real GPU compute
# path is torsh-tensor's oxicuda-based GpuDispatch (runtime driver load, no CUDA
# SDK at build time). This marker feature only selects torsh-backend's pure-Rust
# honest-fallback CUDA API (every op returns an error or delegates to the CPU),
# and is kept so downstream `torsh-backend/cuda` forwards keep resolving.
cuda = []
cudnn = ["cuda"]  # kept as a no-op marker for backward compatibility
metal = ["dep:metal", "dep:objc2", "dep:objc2-metal", "dep:objc2-metal-performance-shaders", "dep:half", "log"]
rocm = []
webgpu = ["dep:wgpu", "dep:bytemuck", "log", "dep:md5"]
async = ["dep:tokio"]

# CPU optimization features
# ⚠️ SciRS2 POLICY: Prefer scirs2-parallel over rayon-threads for new code
rayon-threads = ["dep:rayon"]  # LEGACY: Use scirs2-parallel instead
simd = ["dep:wide"]  # LEGACY: Use scirs2-simd instead
