[package]
name = "torsh-sparse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Sparse tensor operations for ToRSh with SciRS2 integration"
readme = "README.md"
documentation = "https://docs.rs/torsh-sparse"
rust-version.workspace = true
keywords = ["deep-learning", "sparse-tensor", "sparse-matrix", "machine-learning", "csr"]
categories = ["science", "data-structures"]

[lints]
workspace = true

[dependencies]
torsh-core = { workspace = true }
torsh-tensor = { workspace = true }

# SciRS2 ecosystem for sparse operations (required by SCIRS2 policy)
scirs2-core = { workspace = true }
scirs2-sparse = { workspace = true, optional = true }

# Sparse matrix libraries
# sprs REMOVED: zero use sites in src (verified); SciRS2 sparse types are used instead.

# Error handling
thiserror = { workspace = true }

# Utilities
num-traits = { workspace = true }

# Optional CUDA support
cudarc = { workspace = true, optional = true }
# cusparse = { version = "0.3", optional = true }  # Currently not available on crates.io

# Optional Python interoperability
pyo3 = { workspace = true, optional = true, features = ["extension-module"] }
numpy = { workspace = true, optional = true }

# Optional MATLAB compatibility (Pure Rust: the Level-5 .mat container is
# implemented in matlab_mat5.rs, oxiarc-deflate provides zlib inflate)
oxiarc-deflate = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Optional HDF5 support
hdf5 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
# ndarray-hdf5 = { version = "0.7", optional = true }  # Temporarily disabled - version not available

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
fastrand = "2.4"

[[bench]]
name = "sparse_benchmarks"
harness = false

[features]
default = ["scirs2-integration"]
scirs2-integration = ["scirs2-sparse"]
advanced-sparse = ["scirs2-sparse"]
gpu-acceleration = ["scirs2-sparse", "cudarc"]
cuda = ["cudarc"]
scipy = ["pyo3", "numpy"]
matlab = ["oxiarc-deflate", "serde", "serde_json"]
hdf5_support = ["hdf5", "chrono"]
