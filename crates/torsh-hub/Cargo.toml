[package]
name = "torsh-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model hub and pretrained model management for ToRSh"
readme = "README.md"
documentation = "https://docs.rs/torsh-hub"
rust-version.workspace = true
keywords = ["deep-learning", "model-hub", "pretrained", "machine-learning", "pytorch"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[dependencies]
torsh-core = { workspace = true }
torsh-tensor = { workspace = true }
torsh-nn = { workspace = true }
tokio = { workspace = true, features = ["fs", "net"] }
reqwest = { workspace = true, features = ["json", "stream", "blocking"] }
# Pure-Rust TLS provider (replaces reqwest's aws-lc-rs/BoringSSL default backend)
rustls = { workspace = true }
webpki-roots = { workspace = true }
oxitls-rustcrypto-provider = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
oxiarc-deflate = { workspace = true }
oxiarc-archive = { workspace = true }
oxiarc-core = { workspace = true }
base64 = { workspace = true }
oxionnx = { workspace = true }
# SciRS2 compliance - replaces direct ndarray and rand usage
scirs2-core.workspace = true
scirs2-autograd.workspace = true
# tensorflow = { version = "0.21", optional = true }  # DISABLED: tensorflow-sys build issues - use ONNX Runtime (ort) instead
futures = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
indicatif = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "hub_operations"
harness = false

[features]
default = []
# tensorflow = ["dep:tensorflow"]  # DISABLED: tensorflow-sys has build issues - use ONNX Runtime instead
