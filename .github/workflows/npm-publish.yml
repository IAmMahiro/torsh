# npm Publishing Workflow for ToRSh
# Builds the Node.js (N-API) native addon and publishes @torsh/core to npm.
# Mirrors the structure of pypi-publish.yml.

name: npm Publish

on:
  # Manual trigger for publishing
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'npm'
        type: choice
        options:
          - npm
          - none
      version_tag:
        description: 'Version tag (e.g., v0.2.0)'
        required: false
        type: string

  # Trigger on release tags
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"
  # Node.js binding lives here (see crates/torsh-ffi/nodejs/package.json)
  PACKAGE_DIR: crates/torsh-ffi/nodejs

jobs:
  # Build the native addon + TypeScript bindings on each platform
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm dependencies
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm ci || npm install

      - name: Build native addon + TypeScript
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-build-${{ matrix.target }}
          path: |
            ${{ env.PACKAGE_DIR }}/lib
            ${{ env.PACKAGE_DIR }}/native

  # Publish to npm
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'npm')
      || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: npm-build-*
          path: ${{ env.PACKAGE_DIR }}/artifacts

      - name: Publish package
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
